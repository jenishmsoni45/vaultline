[package]
name = "vaultline"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
description = "An encrypted local vault that injects secrets into child processes and templates without writing plaintext to disk."
license = "MIT OR Apache-2.0"
repository = "https://github.com/jenishmsoni45/vaultline"
readme = "README.md"
publish = false

[lib]
name = "vaultline"
path = "src/lib.rs"

[[bin]]
name = "vaultline"
path = "src/main.rs"

[features]
# Test-only hooks: the re-MAC helper (design.md section 2, S3), injected I/O
# faults (P2-10) and a KDF call counter (P2-8). Only this crate's own tests turn
# it on, through the dev-dependency below; a normal build never contains it.
test-support = []

[dependencies]
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
# Not called directly: turns on BLAKE2b's `zeroize` feature, which argon2's own
# `zeroize` feature leaves off, so the hash states Argon2id feeds the passphrase
# through are wiped on drop (D-043).
blake2 = { version = "0.11", default-features = false, features = ["zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["zeroize"] }
clap = { version = "4", features = ["derive"] }
getrandom = "0.4"
hkdf = "0.13"
hmac = { version = "0.13", features = ["zeroize"] }
nix = { version = "0.31", default-features = false, features = ["fs", "user"] }
secrecy = "0.10"
sha2 = { version = "0.11", default-features = false, features = ["zeroize"] }
zeroize = "1"

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
proptest = { version = "1", default-features = false, features = ["std"] }
static_assertions = "1"
tempfile = "3"
vaultline = { path = ".", features = ["test-support"] }

[[bench]]
name = "unlock"
harness = false

# Argon2id, ChaCha20 and SHA-256 are far slower without optimisation. Building
# dependencies (never vaultline itself) optimised keeps the tamper tests and the
# one fixture at the default parameters fast in `cargo test`.
[profile.dev.package."*"]
opt-level = 3
