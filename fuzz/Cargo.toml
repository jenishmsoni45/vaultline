# The fuzz crate is deliberately outside the main workspace: stable `cargo test`
# never builds it, and it needs the nightly toolchain, which runs only in CI
# (D-022). Phase 3 added the `reference` and `template` targets; Phase 4 adds
# `agent_message` (D-035).

[package]
name = "vaultline-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
vaultline = { path = ".." }

[[bin]]
name = "vault_file"
path = "fuzz_targets/vault_file.rs"
test = false
doc = false
bench = false

[[bin]]
name = "reference"
path = "fuzz_targets/reference.rs"
test = false
doc = false
bench = false

[[bin]]
name = "template"
path = "fuzz_targets/template.rs"
test = false
doc = false
bench = false

[[bin]]
name = "agent_message"
path = "fuzz_targets/agent_message.rs"
test = false
doc = false
bench = false

[workspace]
